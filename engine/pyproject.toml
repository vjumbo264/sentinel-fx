[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-engine"
version = "1.0.0"
description = "SENTINEL-FX public engine: indicators, causal feature DSL, rule layer, model loaders, sandbox, pack validator"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
]

[project.optional-dependencies]
lightgbm = ["lightgbm>=4.0"]

[project.scripts]
sentinel-validate = "sentinel_engine.validate:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sentinel_engine*"]
