<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SENTINEL-FX</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lightweight-charts/4.1.3/lightweight-charts.standalone.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/libsodium-wrappers@0.7.13/dist/sodium.min.js"></script>
<link rel="stylesheet" href="style.css">
</head><body>
<header><b>SENTINEL-FX</b><span id="modeBadge"></span><span id="botDot" title="bot status"></span></header>
<div id="auth" class="card">
  <h3>Connect</h3>
  <p class="dim">Paste your GitHub PAT (kept in this browser only).</p>
  <input id="pat" type="password" placeholder="github_pat_...">
  <button onclick="connect()">Connect</button>
  <div id="authMsg" class="dim"></div>
</div>
<main id="app" class="hidden">
  <nav>
    <button data-p="dash" class="on">Dashboard</button><button data-p="pairs">Pairs</button>
    <button data-p="upload">Add/Update</button><button data-p="risk">Risk</button>
    <button data-p="news">News</button><button data-p="logs">Logs</button><button data-p="trades">Trades</button>
  </nav>
  <section id="dash" class="page on">
    <div class="row">
      <div class="card"><div class="dim" id="balLabel">Balance</div><div id="balance" class="big">—</div></div>
      <div class="card"><div class="dim">Today PnL (Lagos)</div><div id="pnl" class="big">—</div></div>
    </div>
    <div class="card">
      <button id="powerBtn" onclick="togglePower()">BOT ON/OFF</button>
      <button id="killBtn" class="danger" onclick="toggleKill()">KILL SWITCH</button>
      <button onclick="toggleMode()">Demo/Real</button>
      <span id="flags" class="dim"></span>
    </div>
    <div class="card">
      <div id="pairTabs"></div>
      <div id="chartStatus" class="dim">chart idle</div>
      <div id="chart" style="height:300px;min-height:240px"></div>
    </div>
  </section>
  <section id="pairs" class="page"><div id="pairList"></div></section>
  <section id="upload" class="page">
    <div class="card">
      <h3>Upload pair pack (.pairpack.json)</h3>
      <input type="file" id="packFile" accept=".json">
      <div id="packReport"></div>
      <button id="promoteBtn" class="hidden" onclick="promotePack()">PROMOTE (install/activate)</button>
    </div>
  </section>
  <section id="risk" class="page"><div class="card" id="riskForm"></div></section>
  <section id="news" class="page"><div id="newsList"></div></section>
  <section id="logs" class="page">
    <div class="card"><select id="logLevel" onchange="loadLogs()">
      <option value="">all</option><option>info</option><option>warn</option><option>error</option></select>
      <div id="logList" class="logbox"></div></div>
  </section>
  <section id="trades" class="page"><div id="tradeList"></div></section>
</main>
<script src="app.js"></script>
</body></html>
