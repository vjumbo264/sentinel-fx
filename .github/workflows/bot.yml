name: bot
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "demo|real (demo default)"
        required: false
        default: "demo"
  schedule:
    - cron: "0 */4 * * *"  # backup every 4h; main driver is self-chain
concurrency:
  group: bot
  cancel-in-progress: false
permissions:
  contents: read
  actions: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 235   # ~3h55m; stops opening ~2min before end
    env:
      WORKER_URL: ${{ secrets.WORKER_URL }}
      BOT_SHARED_SECRET: ${{ secrets.BOT_SHARED_SECRET }}
      DERIV_BEARER_TOKEN: ${{ secrets.DERIV_BEARER_TOKEN }}
      DERIV_APP_ID: ${{ secrets.DERIV_APP_ID }}
      GH_CHAIN_PAT: ${{ secrets.GH_CHAIN_PAT }}
      BOT_MODE: ${{ github.event.inputs.mode || 'demo' }}
      BOT_WALL_SECONDS: "13800"      # 3h50m total loop
      BOT_HANDOFF_LEAD_S: "300"      # dispatch next run 5min before stop
      BOT_STOP_OPEN_LEAD_S: "120"    # stop opening 2min before end
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install
        run: |
          pip install --quiet numpy pandas websockets requests lightgbm
          pip install --quiet ./engine
      - name: Run bot
        run: python -m bot.main
      # FIX-A: crash-proof chaining. If the run ended before its planned wall
      # time (crash, cancel, error), dispatch a replacement run after a short
      # delay. The D1 lease + concurrency group guarantee two runs can never
      # trade at once. Normal mid-run handoff is handled by the bot itself.
      - name: Crash-proof chain (safety dispatch)
        if: always()
        env:
          GH_TOKEN_FOR_CHAIN: ${{ secrets.GH_CHAIN_PAT }}
          JOB_STATUS: ${{ job.status }}
          DISPATCH_MODE: ${{ github.event.inputs.mode || 'demo' }}
        run: |
          if [ "$JOB_STATUS" != "success" ]; then
            echo "run ended early (status=$JOB_STATUS); dispatching replacement run in 60s"
            sleep 60
            curl -sS -X POST \
              -H "Authorization: token $GH_TOKEN_FOR_CHAIN" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/bot.yml/dispatches" \
              -d "{\"ref\":\"main\",\"inputs\":{\"mode\":\"$DISPATCH_MODE\"}}" \
              && echo "replacement run dispatched"
          else
            echo "normal completion; next run already dispatched by the bot itself"
          fi
