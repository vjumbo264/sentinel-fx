name: bot
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "demo|real (demo default)"
        required: false
        default: "demo"
      wall_seconds:
        description: "Wall time; 1200 for acceptance, 17100 for regular runs"
        required: false
        default: "17100"
      chain:
        description: "Enable READY successor handover"
        required: false
        default: "true"
  schedule:
    - cron: "0 */4 * * *"  # backup every 4h; main driver is self-chain
concurrency:
  group: bot-${{ github.run_id }}
  cancel-in-progress: false
permissions:
  contents: read
  actions: write
jobs:
  run:
    runs-on: windows-latest
    timeout-minutes: 300
    env:
      WORKER_URL: ${{ secrets.WORKER_URL }}
      BOT_SHARED_SECRET: ${{ secrets.BOT_SHARED_SECRET }}
      DERIV_BEARER_TOKEN: ${{ secrets.DERIV_BEARER_TOKEN }}
      DERIV_APP_ID: ${{ secrets.DERIV_APP_ID }}
      GH_CHAIN_PAT: ${{ secrets.GH_CHAIN_PAT || github.token }}
      MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
      MT5_DEMO_LOGIN: ${{ secrets.MT5_DEMO_LOGIN || '41286446' }}
      MT5_DEMO_SERVER: ${{ secrets.MT5_DEMO_SERVER || 'Deriv-Demo' }}
      BOT_MODE: ${{ github.event.inputs.mode || 'demo' }}
      BOT_CHAIN: ${{ inputs.chain || 'true' }}
      BOT_WALL_SECONDS: ${{ inputs.wall_seconds || '17100' }}      # 4h45m dispatch trigger
      BOT_HARD_STOP_SECONDS: "18000"
      BOT_HANDOFF_LEAD_S: "300"      # legacy lead retained; WALL controls 4h45m dispatch
      BOT_STOP_OPEN_LEAD_S: "120"    # stop opening 2min before end
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Set up native MT5
        uses: ./.github/actions/mt5-windows
      - name: Run bot
        run: python -m bot.main
      # FIX-A & FIX-4: crash-proof chaining with anti-spam exponential backoff.
      # Halts if 3 consecutive failures occur, preventing infinite dispatch spam.
      - name: Crash-proof chain (safety dispatch)
        shell: bash
        if: always()
        env:
          GH_TOKEN_FOR_CHAIN: ${{ secrets.GH_CHAIN_PAT || github.token }}
          JOB_STATUS: ${{ job.status }}
          DISPATCH_MODE: ${{ github.event.inputs.mode || 'demo' }}
        run: |
          if [ "$JOB_STATUS" != "success" ]; then
            echo "Run ended with status: $JOB_STATUS"
            FAIL_COUNT=$(python -c "
            import urllib.request, json, os
            token = os.environ.get('GH_TOKEN_FOR_CHAIN')
            repo = os.environ.get('GITHUB_REPOSITORY')
            req = urllib.request.Request(
                f'https://api.github.com/repos/{repo}/actions/workflows/bot.yml/runs?per_page=10',
                headers={'Authorization': f'token {token}', 'Accept': 'application/vnd.github+json'}
            )
            consecutive = 0
            try:
                with urllib.request.urlopen(req, timeout=10) as r:
                    runs = json.loads(r.read().decode()).get('workflow_runs', [])
                    for r in runs:
                        if r.get('conclusion') == 'failure':
                            consecutive += 1
                        elif r.get('conclusion') == 'success':
                            break
            except Exception:
                pass
            print(consecutive)
            " | tr -d '\r')
            echo "Consecutive bot failures detected: $FAIL_COUNT"
            if [ "$FAIL_COUNT" -ge 3 ]; then
              echo "CRITICAL: 3 or more consecutive bot failures ($FAIL_COUNT). Circuit breaker opened; halting automated chain."
              curl -sS -X POST "$WORKER_URL/api/bot/log" \
                -H "X-Bot-Secret: $BOT_SHARED_SECRET" \
                -H "Content-Type: application/json" \
                -d '{"level":"critical","pair":"*","message":"CIRCUIT BREAKER: Bot auto-chain halted after consecutive startup failures"}' || true
              exit 0
            fi

            DELAY=$(( (FAIL_COUNT + 1) * 90 ))
            echo "Backing off: waiting ${DELAY}s before dispatching replacement run..."
            sleep $DELAY
            curl -sS -X POST \
              -H "Authorization: token $GH_TOKEN_FOR_CHAIN" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/bot.yml/dispatches" \
              -d "{\"ref\":\"main\",\"inputs\":{\"mode\":\"$DISPATCH_MODE\"}}" \
              && echo "Replacement run dispatched successfully."
          else
            echo "normal completion; next run already dispatched by the bot itself"
          fi
