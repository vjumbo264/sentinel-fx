name: bot
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "demo|real (demo default)"
        required: false
        default: "demo"
      wall_seconds:
        description: "Wall time; 1200 for acceptance, 17100 for regular runs"
        required: false
        default: "17100"
      chain:
        description: "Enable READY successor handover"
        required: false
        default: "true"
  schedule:
    - cron: "0 */4 * * *"  # backup every 4h; main driver is self-chain
concurrency:
  group: bot-${{ github.run_id }}
  cancel-in-progress: false
permissions:
  contents: read
  actions: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      WORKER_URL: ${{ secrets.WORKER_URL }}
      BOT_SHARED_SECRET: ${{ secrets.BOT_SHARED_SECRET }}
      DERIV_BEARER_TOKEN: ${{ secrets.DERIV_BEARER_TOKEN }}
      DERIV_APP_ID: ${{ secrets.DERIV_APP_ID }}
      GH_CHAIN_PAT: ${{ secrets.GH_CHAIN_PAT || github.token }}
      MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
      MT5_DEMO_LOGIN: ${{ secrets.MT5_DEMO_LOGIN || '41286446' }}
      MT5_DEMO_SERVER: ${{ secrets.MT5_DEMO_SERVER || 'Deriv-Demo' }}
      BOT_MODE: ${{ github.event.inputs.mode || 'demo' }}
      BOT_CHAIN: ${{ inputs.chain || 'true' }}
      BOT_WALL_SECONDS: ${{ inputs.wall_seconds || '17100' }}
      BOT_HARD_STOP_SECONDS: "18000"
      BOT_HANDOFF_LEAD_S: "300"
      BOT_STOP_OPEN_LEAD_S: "120"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Guard duplicate live bot and circuit breaker on schedule
        id: guard
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          from datetime import datetime, timezone
          event = os.environ.get("GITHUB_EVENT_NAME", "")
          run_id = int(os.environ.get("GITHUB_RUN_ID", "0") or 0)
          repo = os.environ.get("GITHUB_REPOSITORY", "vjumbo264/sentinel-fx")
          token = os.environ.get("GH_CHAIN_PAT") or os.environ.get("GITHUB_TOKEN", "")
          worker = (os.environ.get("WORKER_URL") or "https://sentinel-fx-worker.vjumbo264.workers.dev").rstrip("/")
          secret = os.environ.get("BOT_SHARED_SECRET", "")
          skip = False
          reason = ""
          if event == "schedule":
              try:
                  req = urllib.request.Request(
                      f"https://api.github.com/repos/{repo}/actions/workflows/bot.yml/runs?per_page=20",
                      headers={"Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json", "User-Agent": "sentinel-bot-guard/1.0"}
                  )
                  runs = json.loads(urllib.request.urlopen(req, timeout=15).read().decode()).get("workflow_runs", [])
                  others = [r for r in runs if int(r.get("id", 0)) != run_id and r.get("status") != "completed"]
                  if others:
                      skip = True
                      reason = f"Another bot.yml run is already active ({others[0]['id']})"
              except Exception as e:
                  print("Warning checking runs:", e)
              if not skip and secret:
                  try:
                      sreq = urllib.request.Request(
                          f"{worker}/api/bot/session",
                          headers={"X-Bot-Secret": secret, "Accept": "application/json", "User-Agent": "sentinel-bot-guard/1.0"}
                      )
                      sess = json.loads(urllib.request.urlopen(sreq, timeout=15).read().decode())
                      settings = sess.get("settings", {})
                      rec = settings.get("bot_recovery") or {}
                      if settings.get("power") is False or settings.get("halt") is True:
                          skip = True
                          reason = "Bot power is OFF or emergency halt is active"
                      elif rec.get("status") == "code_failure_halted":
                          skip = True
                          reason = "Circuit breaker halted after 3 consecutive code failures"
                      elif rec.get("status") == "recovering" and rec.get("next_try_utc"):
                          nxt = datetime.fromisoformat(rec["next_try_utc"].replace("Z", "+00:00"))
                          if datetime.now(timezone.utc) < nxt:
                              skip = True
                              reason = f"Cooldown active until {rec['next_try_utc']}"
                  except Exception as e:
                      print("Warning checking worker session:", e)
          if skip:
              print("SKIP_REASON:", reason)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"skip={'true' if skip else 'false'}\n")
          PY
      - name: Install bot dependencies
        if: steps.guard.outputs.skip != 'true'
        run: |
          pip install numpy pandas websockets requests lightgbm onnx onnxruntime 'rpyc>=6,<7'
          pip install ./engine
      - name: Start verified MT5 stack
        id: mt5_start
        if: steps.guard.outputs.skip != 'true'
        uses: ./.github/actions/mt5-stack
        with:
          action: start
          login: ${{ secrets.MT5_DEMO_LOGIN }}
          password: ${{ secrets.MT5_PASSWORD }}
          server: ${{ secrets.MT5_DEMO_SERVER }}
          port: '18812'
      - name: Run bot
        id: bot_run
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          set -o pipefail
          python -m bot.main 2>&1 | tee crash.log
      - name: Stop MT5 stack
        if: always() && steps.guard.outputs.skip != 'true'
        uses: ./.github/actions/mt5-stack
        with:
          action: stop
      - name: Crash-proof chain (safety dispatch & self-healing)
        shell: bash
        if: always() && steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN_FOR_CHAIN: ${{ secrets.GH_CHAIN_PAT || github.token }}
          JOB_STATUS: ${{ job.status }}
          MT5_START_OUTCOME: ${{ steps.mt5_start.outcome }}
          BOT_RUN_OUTCOME: ${{ steps.bot_run.outcome }}
          DISPATCH_MODE: ${{ github.event.inputs.mode || 'demo' }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
          BOT_SHARED_SECRET: ${{ secrets.BOT_SHARED_SECRET }}
        run: |
          python tools/bot_safety_dispatch.py
