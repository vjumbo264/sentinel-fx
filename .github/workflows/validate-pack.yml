name: validate-pack
on:
  push:
    paths:
      - "pairs/*/incoming/**"
  workflow_dispatch:
    inputs:
      path:
        description: "Pack path (pairs/<symbol>/incoming/<v>.json)"
        required: true
permissions:
  contents: write
jobs:
  validate:
    # SECURITY: this job has NO deriv token, NO bot secret, NO repo PAT.
    # Only GITHUB_TOKEN (automatic, scoped to this repo) is available.
    runs-on: ubuntu-latest
    env: {}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install engine (public)
        run: |
          pip install --quiet numpy pandas lightgbm
          pip install --quiet ./engine
      - name: Discover pack files
        id: files
        run: |
          if [ -n "${{ github.event.inputs.path }}" ]; then
            echo "list=${{ github.event.inputs.path }}" >> $GITHUB_OUTPUT
          else
            FILES=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep -E '^pairs/.*/incoming/.*\.json$' || true)
            echo "list<<EOF" >> $GITHUB_OUTPUT
            echo "$FILES" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi
      - name: Validate each pack
        if: steps.files.outputs.list != ''
        run: |
          set -e
          for f in ${{ steps.files.outputs.list }}; do
            [ -z "$f" ] && continue
            echo "=== Validating $f ==="
            python -m sentinel_engine.validate "$f" --mode full | tee "${f%.json}.report.txt" || true
            # Store machine report alongside the pack
            python -m sentinel_engine.validate "$f" --mode full > "${f%.json}.report.json" 2>/dev/null || true
          done
      - name: Commit reports
        if: steps.files.outputs.list != ''
        run: |
          git config user.name "sentinel-validator"
          git config user.email "validator@sentinel-fx.local"
          git add pairs/*/incoming/*.report.* 2>/dev/null || true
          git commit -m "validator: reports [skip ci]" || true
          git push || true
