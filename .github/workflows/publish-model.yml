name: publish-model
on:
  workflow_dispatch:
    inputs:
      symbol:
        description: "frxXXXYYY"
        required: true
      version:
        description: "integer model version"
        required: true
      min_trades:
        description: "min hold-out trades (0 = plumbing test only)"
        required: false
        default: "300"
permissions:
  contents: write
concurrency:
  group: publish-model
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SYMBOL: ${{ github.event.inputs.symbol }}
      VERSION: ${{ github.event.inputs.version }}
    steps:
      - name: Validate inputs (env only, never interpolated)
        run: |
          python3 - <<'EOF'
          import os, re
          sym = os.environ["SYMBOL"]
          assert re.match(r"^([A-Z]{6}|frx[A-Z]{6}|R_\d+|1HZ\d+V|Volatility[\w\s\(\)]+)$", sym), f"bad symbol: {sym}"
          assert os.environ["VERSION"].isdigit(), "bad version"
          EOF
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install engine
        run: |
          pip install --quiet numpy pandas onnx onnxruntime lightgbm
          pip install --quiet ./engine
      - name: Download staged bundle (NO secrets beyond GITHUB_TOKEN)
        run: |
          CLEAN_SYM=$(echo "$SYMBOL" | tr ' ' '_' | tr -d '()' )
          ASSET="${CLEAN_SYM}_v${VERSION}.sfxmodel.zip"
          gh release download staging -p "$ASSET" -R "$GITHUB_REPOSITORY" \
            -D . --clobber
          ls -la "$ASSET"
      - name: CHECKER (code and bundle health)
        run: |
          CLEAN_SYM=$(echo "$SYMBOL" | tr ' ' '_' | tr -d '()' )
          ASSET="${CLEAN_SYM}_v${VERSION}.sfxmodel.zip"
          echo "CHECKER: running health check on $ASSET"
          python3 -m sentinel_engine.check "$ASSET" | tee validator.report.txt
      - name: Publish into shared models release
        if: success()
        run: |
          CLEAN_SYM=$(echo "$SYMBOL" | tr ' ' '_' | tr -d '()' )
          ASSET="${CLEAN_SYM}_v${VERSION}.sfxmodel.zip"
          gh release view models-01 -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create models-01 -R "$GITHUB_REPOSITORY" --title "models-01" \
              --notes "SENTINEL-FX trained model bundles (shared release 01)."
          gh release upload models-01 -R "$GITHUB_REPOSITORY" "$ASSET" --clobber
      - name: Update models/index.json
        if: success()
        run: |
          git config user.name "sentinel-publish"
          git config user.email "publish@sentinel-fx.local"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git checkout -B main origin/main
            python3 - <<'EOF'
          import hashlib, json, os, zipfile
          from datetime import datetime, timezone
          sym, ver = os.environ["SYMBOL"], int(os.environ["VERSION"])
          clean_sym = sym.replace(" ", "_").replace("(", "").replace(")", "")
          fn = f"{clean_sym}_v{ver}.sfxmodel.zip"
          with zipfile.ZipFile(fn) as zf:
              manifest = json.loads(zf.read("manifest.json"))
              tr_rep = json.loads(zf.read("training_report.json")) if "training_report.json" in zf.namelist() else {}
          idx = {}
          if os.path.exists("models/index.json"):
              idx = json.load(open("models/index.json"))
          os.makedirs("models", exist_ok=True)
          ent = idx.setdefault(sym, {"active_version": None, "versions": []})
          prev = next((v for v in ent["versions"] if v.get("N") == ver), {})
          ent["versions"] = [v for v in ent["versions"] if v["N"] != ver]
          rec = {
              **prev,
              "N": ver,
              "release_tag": "models-01",
              "asset": fn,
              "sha256": hashlib.sha256(open(fn, "rb").read()).hexdigest(),
              "size": os.path.getsize(fn),
              "created_utc": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "observation_dim": manifest.get("observation_dim", 62),
              "policy_schema": manifest.get("policy_schema", "sentinel.policy.v2"),
              "mt5_symbol": manifest.get("mt5_symbol", sym.removeprefix("frx")),
              "steps": tr_rep.get("steps", prev.get("steps", 0)),
              "data_end_utc": tr_rep.get("data_end_utc") or prev.get("data_end_utc"),
              "verdict": tr_rep.get("verdict") or prev.get("verdict") or "test_only",
              "release_decision": tr_rep.get("release_decision") or prev.get("release_decision") or "Validated 62-dim bundle; enable explicitly to trade",
          }
          if tr_rep.get("checkpoint_asset"):
              rec["checkpoint_asset"] = tr_rep["checkpoint_asset"]
              rec["checkpoint_release_tag"] = tr_rep.get("checkpoint_release_tag", "training-checkpoints")
              rec["checkpoint_sha256"] = tr_rep.get("checkpoint_sha256")
          ent["versions"].append(rec)
          # Never switch active_version automatically; owner enables explicitly.
          ent["candidate_version"] = ver
          json.dump(idx, open("models/index.json", "w"), indent=2, sort_keys=True)
          EOF
            git add models/index.json validator.report.txt
            git commit -m "models: publish ${SYMBOL} v${VERSION} (validated) [skip ci]" || true
            git push origin main && break
            sleep 3
          done
      - name: On failure leave staging file for inspection
        if: failure()
        run: |
          echo "VALIDATOR failed; staged bundle left in 'staging' release for inspection."
          cat validator.report.txt || true
