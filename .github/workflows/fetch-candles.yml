name: fetch-candles
on:
  workflow_dispatch:
    inputs:
      symbols:
        description: "comma list (frxXXXYYY) or 'all'"
        required: false
        default: "all"
      granularity:
        description: "seconds per candle"
        required: false
        default: "60"
      mode:
        description: "incremental|full"
        required: false
        default: "incremental"
  schedule:
    - cron: "30 0 * * *"    # daily 00:30 UTC (01:30 Lagos): update tracked pairs
    - cron: "0 3 1 * *"     # monthly keepalive (public-repo scheduled-workflow guard)
permissions:
  contents: write
concurrency:
  group: candles
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Build pair matrix (inputs validated, passed via env only)
        id: m
        env:
          SYMBOLS_IN: ${{ github.event.inputs.symbols || 'all' }}
        run: |
          python3 - <<'EOF'
          import json, os, re
          tracked = json.load(open("data/tracked_pairs.json"))["pairs"]
          req = (os.environ.get("SYMBOLS_IN") or "all").strip()
          if req and req != "all":
              syms = [s.strip() for s in req.split(",") if s.strip()]
              for s in syms:
                  if not re.match(r"^(frx[A-Z]{6}|R_\d+|1HZ\d+V)$", s):
                      raise SystemExit(f"invalid symbol {s!r}")
          else:
              syms = tracked
          mat = json.dumps({"symbol": syms})
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("matrix=" + mat + "\n")
          print("matrix:", mat)
          EOF

  keepalive:
    # Runs only on the monthly schedule; the daily index commits already count
    # as repo activity, this is belt-and-braces against Actions auto-pause.
    if: github.event_name == 'schedule' && github.event.schedule == '0 3 1 * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name "sentinel-keepalive"
          git config user.email "keepalive@sentinel-fx.local"
          date -u +%Y-%m-%dT%H:%M:%SZ > data/.keepalive
          git add data/.keepalive
          git commit -m "keepalive: monthly activity commit [skip ci]" || true
          git push || true

  fetch:
    if: github.event_name != 'schedule' || github.event.schedule == '30 0 * * *'
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      max-parallel: 3
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      SYMBOL: ${{ matrix.symbol }}
      GRANULARITY: ${{ github.event.inputs.granularity || '60' }}
      MODE: ${{ github.event.inputs.mode || 'incremental' }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DERIV_BEARER_TOKEN: ${{ secrets.DERIV_BEARER_TOKEN }}
      DERIV_APP_ID: ${{ secrets.DERIV_APP_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Install
        run: pip install --quiet websockets requests
      - name: Download existing asset for incremental merge
        run: |
          mkdir -p out prev
          ASSET="${SYMBOL}_${GRANULARITY}s.csv.gz"
          gh release download data-01 -p "$ASSET" -R "$GITHUB_REPOSITORY" -D prev --clobber 2>/dev/null || \
            echo "no existing asset; first run is a full pull"
      - name: Fetch candles (Dukascopy for Forex, Deriv for Synthetics)
        run: |
          EXIST="prev/${SYMBOL}_${GRANULARITY}s.csv.gz"
          [ -f "$EXIST" ] || EXIST=""
          python3 tools/fetch_candles.py --symbol "$SYMBOL" \
            --granularity "$GRANULARITY" --mode "$MODE" \
            ${EXIST:+--existing "$EXIST"} --out out | tee fetch.log
      - name: Prepare source report from real CSV and stats
        run: |
          python - <<'PY'
          import json,gzip,csv,os
          from pathlib import Path
          stats=next(json.loads(line[6:]) for line in reversed(Path('fetch.log').read_text().splitlines()) if line.startswith('STATS '))
          path=Path('out')/stats['file']
          with gzip.open(path,'rt') as f:stats['columns']=next(csv.reader(f))
          Path(str(path)+'.report.json').write_text(json.dumps(stats,indent=2))
          PY
      - name: Verify immutable release upload before index CAS
        run: python tools/publish_data.py "out/${SYMBOL}_${GRANULARITY}s.csv.gz"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: data-report-${{ matrix.symbol }}
          path: out/*.report.json
