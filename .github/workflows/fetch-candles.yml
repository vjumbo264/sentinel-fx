name: fetch-candles
on:
  workflow_dispatch:
    inputs:
      symbols:
        description: comma-separated symbols or all
        default: all
      granularity:
        description: M1 only
        default: '60'
      mode:
        description: append only (legacy input retained)
        default: incremental
  schedule:
    - cron: '30 0 * * 0'
permissions:
  contents: write
concurrency:
  group: candles
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        env:
          SYMBOLS: ${{ inputs.symbols || 'all' }}
        run: |
          python - <<'PY'
          import json,os,re
          symbols=os.environ['SYMBOLS']
          if symbols=='all':
              symbols=list(dict.fromkeys(json.load(open('data/tracked_pairs.json'))['pairs']+list(json.load(open('data/index.json')))))
          else: symbols=symbols.split(',')
          symbols=[s.strip() for s in symbols]
          assert symbols and all(re.fullmatch(r'(frx[A-Z]{6}|R_\d+|1HZ\d+V)',s) for s in symbols),'Invalid symbol'
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('matrix='+json.dumps({'symbol':symbols})+'\n')
          PY
  append:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      SYMBOL: ${{ matrix.symbol }}
      GH_TOKEN: ${{ secrets.GH_CHAIN_PAT || github.token }}
      DERIV_BEARER_TOKEN: ${{ secrets.DERIV_BEARER_TOKEN }}
      DERIV_APP_ID: ${{ secrets.DERIV_APP_ID }}
      FETCH_DEADLINE_S: '840'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet 'websockets==12.0' requests numpy
      - name: Append newer UTC candles; immutable base; verified source join
        run: python tools/append_deriv.py
