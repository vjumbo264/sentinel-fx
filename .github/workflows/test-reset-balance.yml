name: test-reset-balance
on:
  workflow_dispatch:

jobs:
  test_reset:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DERIV_BEARER_TOKEN: ${{ secrets.DERIV_BEARER_TOKEN }}
      DERIV_APP_ID: ${{ secrets.DERIV_APP_ID }}
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install --quiet websockets
      - run: |
          python3 - <<'PYEOF'
          import asyncio, json, os, websockets

          token = os.environ.get("DERIV_BEARER_TOKEN", "")
          app_id = os.environ.get("DERIV_APP_ID", "1089")

          async def test():
              url = f"wss://ws.derivws.com/websockets/v3?app_id={app_id}"
              try:
                  async with websockets.connect(url, extra_headers={"User-Agent": "Mozilla/5.0", "Origin": "https://deriv.com"}) as ws:
                      # Authorize with token
                      await ws.send(json.dumps({"authorize": token}))
                      auth_res = json.loads(await ws.recv())
                      print("Auth response:", auth_res.get("msg_type"), auth_res.get("error"))
                      if "authorize" in auth_res:
                          print("Authorized account:", auth_res["authorize"].get("loginid"), "is_virtual:", auth_res["authorize"].get("is_virtual"))
                          # Try topup_virtual
                          await ws.send(json.dumps({"topup_virtual": 1}))
                          topup_res = json.loads(await ws.recv())
                          print("Topup response:", topup_res)
              except Exception as e:
                  print("WS error:", e)

          asyncio.run(test())
          PYEOF
