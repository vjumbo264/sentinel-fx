name: test-reset-balance
on:
  workflow_dispatch:

jobs:
  test_reset:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DERIV_BEARER_TOKEN: ${{ secrets.DERIV_BEARER_TOKEN }}
      DERIV_APP_ID: ${{ secrets.DERIV_APP_ID }}
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install --quiet requests
      - run: |
          python3 - <<'PYEOF'
          import os, json, requests

          token = os.environ.get("DERIV_BEARER_TOKEN", "")
          app_id = os.environ.get("DERIV_APP_ID", "1089")

          headers = {
              "Authorization": f"Bearer {token}",
              "Deriv-App-ID": app_id,
              "Accept": "application/json",
              "User-Agent": "sentinel-fx-test/1.0"
          }

          # 1. Fetch accounts
          r = requests.get("https://api.derivws.com/trading/v1/options/accounts", headers=headers)
          print("Accounts HTTP:", r.status_code, r.text)
          accs = r.json().get("data", [])

          demo_acc = next((a for a in accs if a.get("account_type") == "demo"), None)
          if not demo_acc:
              print("No demo account found!")
              raise SystemExit(1)

          acc_id = demo_acc.get("account_id") or demo_acc.get("loginid")
          print("Found demo account:", acc_id, "Current balance:", demo_acc.get("balance"))

          # 2. Call reset-demo-balance
          url = f"https://api.derivws.com/trading/v1/options/accounts/{acc_id}/reset-demo-balance"
          r_reset = requests.post(url, headers=headers)
          print("Reset response HTTP:", r_reset.status_code, r_reset.text)

          # 3. Check balance again
          r2 = requests.get("https://api.derivws.com/trading/v1/options/accounts", headers=headers)
          accs2 = r2.json().get("data", [])
          demo_acc2 = next((a for a in accs2 if a.get("account_id") == acc_id), {})
          print("Updated balance:", demo_acc2.get("balance"))
          PYEOF
