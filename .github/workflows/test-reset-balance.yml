name: test-reset-balance
on:
  workflow_dispatch:

jobs:
  test_reset:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DERIV_BEARER_TOKEN: ${{ secrets.DERIV_BEARER_TOKEN }}
      DERIV_APP_ID: ${{ secrets.DERIV_APP_ID }}
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: |
          python3 - <<'PYEOF'
          import json, os, urllib.request

          token = os.environ.get("DERIV_BEARER_TOKEN", "")
          app_id = os.environ.get("DERIV_APP_ID", "")

          req = urllib.request.Request(
              "https://api.derivws.com/trading/v1/options/accounts",
              headers={
                  "Authorization": f"Bearer {token}",
                  "Deriv-App-ID": app_id,
                  "Accept": "application/json"
              }
          )
          with urllib.request.urlopen(req, timeout=20) as r:
              accs = json.loads(r.read().decode())
          print("Accounts:", json.dumps(accs, indent=2))
          PYEOF
