name: test-reset-balance
on:
  workflow_dispatch:

jobs:
  test_reset:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DERIV_BEARER_TOKEN: ${{ secrets.DERIV_BEARER_TOKEN }}
      DERIV_APP_ID: ${{ secrets.DERIV_APP_ID }}
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: |
          python3 - <<'PYEOF'
          import json, os, urllib.request, urllib.error

          token = os.environ.get("DERIV_BEARER_TOKEN", "")
          app_id = os.environ.get("DERIV_APP_ID", "")
          loginid = "DOT93176227"

          endpoints = [
              f"https://api.derivws.com/trading/v1/options/accounts/{loginid}/topup",
              f"https://api.derivws.com/trading/v1/options/accounts/{loginid}/reset",
              f"https://api.derivws.com/trading/v1/options/accounts/{loginid}/funds/reset",
              f"https://api.derivws.com/trading/v1/options/accounts/{loginid}/balance",
              f"https://api.derivws.com/trading/v1/options/accounts/{loginid}/topup_virtual",
              f"https://api.derivws.com/trading/v1/options/accounts/{loginid}/faucet",
              f"https://api.derivws.com/trading/v1/options/accounts/{loginid}/deposit"
          ]

          for ep in endpoints:
              for method in ["POST", "PUT"]:
                  try:
                      req = urllib.request.Request(
                          ep,
                          data=b"{}",
                          method=method,
                          headers={
                              "Authorization": f"Bearer {token}",
                              "Deriv-App-ID": app_id,
                              "Content-Type": "application/json",
                              "Accept": "application/json"
                          }
                      )
                      with urllib.request.urlopen(req, timeout=10) as r:
                          print(f"SUCCESS {method} {ep}: {r.status} {r.read().decode()}")
                  except urllib.error.HTTPError as e:
                      print(f"{method} {ep} -> {e.code} {e.read().decode()}")
                  except Exception as e:
                      print(f"{method} {ep} -> {e}")
          PYEOF
