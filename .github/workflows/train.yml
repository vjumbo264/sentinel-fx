name: RL Training

on:
  workflow_dispatch:
    inputs:
      mode:
        description: resume existing cycle, start new weights, or update existing weights
        type: choice
        options: [resume, start, update]
        default: resume
      pair:
        description: pair, comma-separated pairs, or all for Update all
        type: string
        default: ''

permissions:
  contents: write
  actions: write

concurrency:
  group: rl-training-single-writer
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      GH_CHAIN_PAT: ${{ secrets.GH_CHAIN_PAT }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TRAIN_WALL_SECONDS: '17100'
      TRAIN_CPU_THREADS: '2'
      TRAIN_MODE: ${{ inputs.mode || 'resume' }}
      TRAIN_PAIR: ${{ inputs.pair || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install CPU training dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install stable-baselines3 gymnasium onnx onnxruntime numpy pandas requests
          pip install ./engine
      - name: Set training lock
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          BOT_SHARED_SECRET: ${{ secrets.BOT_SHARED_SECRET }}
          GH_CHAIN_PAT: ${{ secrets.GH_CHAIN_PAT }}
        run: |
          curl -sS -X POST "$WORKER_URL/api/settings/training-lock" \
            -H "Authorization: Bearer $GH_CHAIN_PAT" \
            -H "Content-Type: application/json" \
            -d '{"locked":true,"reason":"train.yml active"}' \
            && echo "Training lock set"
      - name: Resume pair training
        run: python tools/train_agent.py
      - name: Clear training lock
        if: always()
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          GH_CHAIN_PAT: ${{ secrets.GH_CHAIN_PAT }}
        run: |
          curl -sS -X POST "$WORKER_URL/api/settings/training-lock" \
            -H "Authorization: Bearer $GH_CHAIN_PAT" \
            -H "Content-Type: application/json" \
            -d '{"locked":false,"reason":""}' \
            && echo "Training lock cleared"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: training-state-${{ github.run_id }}
          path: |
            training_state.json
            cache/training/*.zip
          if-no-files-found: ignore
