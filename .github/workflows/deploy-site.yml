name: deploy-site
on:
  push:
    paths:
      - "site/**"
      - ".github/workflows/deploy-site.yml"
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: deploy-site
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy site/ to Cloudflare Pages (sentinel-fx)
        run: npx --yes wrangler@latest pages deploy site --project-name sentinel-fx --branch main
