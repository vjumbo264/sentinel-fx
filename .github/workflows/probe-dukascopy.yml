name: probe-dukascopy
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: B2 diag - curl single bi5 hourly files (status, headers, size)
        run: |
          for U in \
            "https://datafeed.dukascopy.com/datafeed/EURUSD/2024/05/14/10h_ticks.bi5" \
            "https://datafeed.dukascopy.com/datafeed/EURUSD/2026/09/09/10h_ticks.bi5" \
            "https://freeserv.dukascopy.com/2.0/datafeed/EURUSD/2026/09/09/10h_ticks.bi5"; do
            echo "=== $U ==="
            curl -sS --max-time 60 -D /tmp/h.txt -o /tmp/probe.bin -w "HTTP %{http_code} size=%{size_download} time=%{time_total}s\n" "$U" || echo "CURL_FAILED $?"
            echo "--- response headers ---"; head -15 /tmp/h.txt 2>/dev/null || echo "no headers"
            ls -l /tmp/probe.bin 2>/dev/null; rm -f /tmp/probe.bin
          done
      - name: B2 diag - python urllib + LZMA decode of one bi5 file
        run: |
          python3 - <<'PYEOF'
          import urllib.request, lzma
          for url in [
            "https://datafeed.dukascopy.com/datafeed/EURUSD/2024/05/14/10h_ticks.bi5",
            "https://datafeed.dukascopy.com/datafeed/EURUSD/2026/09/09/10h_ticks.bi5",
            "https://freeserv.dukascopy.com/2.0/datafeed/EURUSD/2026/09/09/10h_ticks.bi5",
          ]:
              print("===", url)
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                  raw = urllib.request.urlopen(req, timeout=20).read()
                  print("downloaded", len(raw), "bytes, head:", raw[:8].hex())
                  try:
                      d = lzma.decompress(raw, format=lzma.FORMAT_ALONE)
                      print("LZMA_ALONE ok:", len(d), "bytes ->", len(d)//20, "20-byte records")
                  except Exception as e1:
                      print("LZMA_ALONE fail:", e1)
                      d = lzma.decompress(raw)
                      print("LZMA auto ok:", len(d), "bytes ->", len(d)//20, "records")
              except Exception as e:
                  print("ERROR", type(e).__name__, e)
          PYEOF
      - name: B2 diag - dukascopy-node one-month range (throttle probe)
        run: |
          npx --yes dukascopy-node -i eurusd -from 2026-09-01 -to 2026-10-01 -t m1 -p bid -v -f csv -dir /tmp/dk -r 5 -rp 3000 -s || echo "DUKA_NODE_EXIT $?"
          find /tmp/dk -type f 2>/dev/null | head -5
          for f in $(find /tmp/dk -name '*.csv' 2>/dev/null); do wc -c "$f"; head -3 "$f"; done
