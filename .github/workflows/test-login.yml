name: test-login
on:
  workflow_dispatch:
    inputs:
      mode:
        description: demo only in the lean mission
        default: demo
      probe_wrong_password:
        description: also verify a deliberately incorrect password is rejected
        type: boolean
        default: false
concurrency:
  group: test-login
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  test_login:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LOGIN_MODE: demo
      PROBE_WRONG_PASSWORD: ${{ inputs.probe_wrong_password || 'false' }}
      WORKER_URL: ${{ secrets.WORKER_URL }}
      BOT_SHARED_SECRET: ${{ secrets.BOT_SHARED_SECRET }}
      GH_CHAIN_PAT: ${{ secrets.GH_CHAIN_PAT }}
      MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
      MT5_DEMO_LOGIN: ${{ secrets.MT5_DEMO_LOGIN }}
      MT5_DEMO_SERVER: ${{ secrets.MT5_DEMO_SERVER }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet 'rpyc>=6,<7'
      - name: Start verified Linux MT5 stack
        uses: ./.github/actions/mt5-stack
        with:
          action: start
          login: ${{ secrets.MT5_DEMO_LOGIN }}
          password: ${{ secrets.MT5_PASSWORD }}
          server: ${{ secrets.MT5_DEMO_SERVER }}
      - name: Read-only login probe; correct credentials restored
        run: python tools/test_mt5_login.py
      - name: Stop stack
        if: always()
        uses: ./.github/actions/mt5-stack
        with:
          action: stop
