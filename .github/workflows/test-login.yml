name: test-login
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "demo or real (read-only)"
        required: false
        default: "demo"

concurrency:
  group: test-login
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test_login:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      LOGIN_MODE: ${{ github.event.inputs.mode || 'demo' }}
      WORKER_URL: ${{ secrets.WORKER_URL || 'https://sentinel-fx-worker.vjumbo264.workers.dev' }}
      BOT_SHARED_SECRET: ${{ secrets.BOT_SHARED_SECRET }}
      GH_CHAIN_PAT: ${{ secrets.GH_CHAIN_PAT }}
      MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
      MT5_DEMO_LOGIN: ${{ secrets.MT5_DEMO_LOGIN || '41286446' }}
      MT5_DEMO_SERVER: ${{ secrets.MT5_DEMO_SERVER || 'Deriv-Demo' }}
      MT5_REAL_LOGIN: ${{ secrets.MT5_REAL_LOGIN || '10357278' }}
      MT5_REAL_SERVER: ${{ secrets.MT5_REAL_SERVER || 'DerivSVG-Server' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Set up native MT5
        uses: ./.github/actions/mt5-windows
      - name: Test MT5 Login
        run: python tools/test_mt5_login.py
