name: forex-history (HistData compatibility entrypoint)
on:
  workflow_dispatch:
    inputs:
      from:
        description: Legacy date input; HistData resumes indexed annual history instead
        default: '2000-01-01'
      to:
        description: Legacy date input; current available history is used
        default: ''
permissions:
  contents: read
  actions: write
jobs:
  dispatch-histdata:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      GH_CHAIN_PAT: ${{ secrets.GH_CHAIN_PAT || github.token }}
      LEGACY_PAIRS: ${{ inputs.pairs || 'EURUSD' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install requests
      - name: Dispatch resumable HistData replacement
        run: |
          python - <<'PY'
          import os
          from tools.release_utils import GitHub
          from tools.fetch_histdata_bulk import PAIRS
          requested = os.environ['LEGACY_PAIRS']
          pairs = PAIRS if requested == 'all' else [p.strip().upper().removeprefix('FRX') for p in requested.split(',')]
          assert all(p in PAIRS for p in pairs), 'Only the 13 overhaul target pairs are supported'
          GitHub(os.environ['GH_CHAIN_PAT']).dispatch('histdata-bulk.yml', {'pairs': ','.join(pairs)})
          print('Legacy Dukascopy jobs retired; resumable HistData workflow dispatched. Date inputs are deprecated.')
          PY
