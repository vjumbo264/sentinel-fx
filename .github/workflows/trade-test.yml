name: trade-test
on:
  workflow_dispatch:
    inputs:
      synthetic_symbol:
        description: "Synthetic symbol name"
        required: false
        default: "Volatility 10 Index"
      forex_symbol:
        description: "Forex symbol name"
        required: false
        default: "EURUSD"

permissions:
  contents: write

jobs:
  trade-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_CHAIN_PAT || github.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Start MT5 Linux Stack
        uses: ./.github/actions/mt5-stack
        with:
          action: start
          login: ${{ secrets.MT5_DEMO_LOGIN || '41286446' }}
          password: ${{ secrets.MT5_PASSWORD || 'Kaiju-No.8' }}
          server: ${{ secrets.MT5_DEMO_SERVER || 'Deriv-Demo' }}
          port: '18812'
          container-name: 'mt5-trade-test'

      - name: Run CFD Trade Test
        env:
          MT5_DEMO_LOGIN: ${{ secrets.MT5_DEMO_LOGIN || '41286446' }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD || 'Kaiju-No.8' }}
          MT5_DEMO_SERVER: ${{ secrets.MT5_DEMO_SERVER || 'Deriv-Demo' }}
          WORKER_URL: https://sentinel-fx-worker.vjumbo264.workers.dev
          BOT_SHARED_SECRET: ${{ secrets.BOT_SHARED_SECRET }}
        run: |
          python3 tools/trade_test.py \
            --synthetic-symbol "${{ github.event.inputs.synthetic_symbol || 'Volatility 10 Index' }}" \
            --forex-symbol "${{ github.event.inputs.forex_symbol || 'EURUSD' }}" \
            --out docs/cfd_trade_test_report.json

      - name: Stop MT5 Linux Stack
        if: always()
        uses: ./.github/actions/mt5-stack
        with:
          action: stop
          container-name: 'mt5-trade-test'

      - name: Commit and Push Trade Test Evidence
        if: always()
        run: |
          git config user.name "Victor Jumbo (Sentinel Builder)"
          git config user.email "jumbovictor700@gmail.com"
          if [ -f docs/cfd_trade_test_report.json ]; then
            git add docs/cfd_trade_test_report.json
            git commit -m "docs: record CFD trade test evidence [skip ci]" || true
            git push origin main || true
          fi
