name: deploy-worker
on:
  push:
    paths:
      - "worker/**"
      - ".github/workflows/deploy-worker.yml"
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DERIV_BEARER_TOKEN: ${{ secrets.DERIV_BEARER_TOKEN }}
      DERIV_APP_ID: ${{ secrets.DERIV_APP_ID }}
      BOT_SHARED_SECRET: ${{ secrets.BOT_SHARED_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy worker
        run: |
          cd worker
          npx --yes wrangler deploy
          echo "$BOT_SHARED_SECRET" | npx wrangler secret put BOT_SHARED_SECRET
          echo "$DERIV_BEARER_TOKEN" | npx wrangler secret put DERIV_BEARER_TOKEN
          echo "$DERIV_APP_ID" | npx wrangler secret put DERIV_APP_ID
